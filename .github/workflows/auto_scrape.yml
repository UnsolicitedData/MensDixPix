name: DixPix Auto-Scraper

on:
  schedule:
    # Standard 8-hour pulse (change to */4 if you want 4-hour updates)
    - cron: '0 */8 * * *'
    # Sunday Early Slate Closing Line Lock: 12:00 PM EST (17:00 UTC)
    - cron: '0 17 * * 0'
    # Sunday Late Slate Closing Line Lock: 4:00 PM EST (21:00 UTC)
    - cron: '0 21 * * 0'
    # Primetime Kickoff Locks (TNF, SNF, MNF): 7:50 PM EST (00:50 UTC next day)
    - cron: '50 0 * * 1,2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run DixPix Scraper & Auto-Grader
        env:
          GITHUB_ACTIONS: "true"
          DIXPIX_ODDS_API_KEY: ${{ secrets.DIXPIX_ODDS_API_KEY }}
        run: python scraper.py

      - name: Commit and Push updated data.json
        run: |
          git config --global user.name "DixPix Auto-Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update calibrated odds & graded ledger"
            git pull --rebase -X ours origin main
            git push
          )
