name: DixPix Auto-Scraper

on:
  schedule:
    # Standard 8-hour pulse (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
    # Saturday NCAA Closing Line Locks (DST-safe for both EDT & EST):
    # 11:30 AM EDT / 10:30 AM EST (Noon slate) & 3:00 PM EDT / 2:00 PM EST (3:30 PM slate)
    - cron: '30 15 * * 6'
    - cron: '0 19 * * 6'
    # Sunday NFL Early Closing Lock: 12:45 PM EDT / 11:45 AM EST (after 11:30 AM inactives, before 1:00 PM kickoff year-round)
    - cron: '45 16 * * 0'
    # Sunday NFL Late Closing Lock: 3:45 PM EDT / 2:45 PM EST (after 2:35 PM inactives, before 4:05 PM kickoff year-round)
    - cron: '45 19 * * 0'
    # Primetime NFL Locks (TNF Thu, SNF Sun, MNF Mon): 7:55 PM EDT / 6:55 PM EST (after 6:45 PM inactives, before 8:15 PM kickoff year-round)
    - cron: '55 23 * * 0,1,4'
  workflow_dispatch:

concurrency:
  group: dixpix-auto-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run DixPix Scraper & Auto-Grader
        env:
          GITHUB_ACTIONS: "true"
          DIXPIX_ODDS_API_KEY: ${{ secrets.DIXPIX_ODDS_API_KEY }}
        run: python scraper.py

      - name: Commit and Push updated data.json
        run: |
          git config --global user.name "DixPix Auto-Bot"
          git config --global user.email "actions@github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto-update calibrated odds & graded ledger"
            git pull --rebase -X theirs origin main
            git push
          )
